<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>time capsule</title>

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Nunito:wght@400;700&display=swap">
  <link rel="stylesheet" href="style.css">

  <style>
    .home { max-width: 600px; margin: 0 auto; padding: 8vh 24px; text-align: center; }
    .home ul { list-style: none; padding: 0; }
    .home li { padding: 6px 0; }
  </style>
</head>
<body id = "homepage">
  <div id="snowContainer" aria-hidden="true"></div>
  <main class="home">
    <h1>time capsule</h1>
    <p>freeze your moments and open them later.</p>

    <button id="open">open my capsule</button>

    <h2>your moments</h2>
    <ul id="moments"></ul>
  </main>

  <script>
    document.getElementById("open").addEventListener("click", function () {
      location.href = "home.html";
    });
    const list = document.getElementById("moments");
    let tabs = [];
    try {
      const saved = JSON.parse(localStorage.getItem("timeCapsule"));
      if (saved && saved.tabs) tabs = saved.tabs;
    } catch (e) {}

    if (!tabs.length) {
      const li = document.createElement("li");
      li.textContent = "no moments yet";
      list.appendChild(li);
    }

    tabs.forEach(function (tab) {
      const n = tab.photos.length;
      let text = tab.name + " · " + n + " photo" + (n === 1 ? "" : "s");
      if (tab.sealedUntil && Date.now() < tab.sealedUntil) {
        text += " · sealed until " + new Date(tab.sealedUntil).toLocaleString();
      }
      const li = document.createElement("li");
      li.textContent = text;
      list.appendChild(li);
    });
  </script>
  <script>
    const snowBox = document.getElementById("snowContainer");
    const flakes = ["❄", "❅", "❆", "•"];
    setInterval(() => {
      const f = document.createElement("div");
      f.className = "snowflake";
      f.textContent = flakes[Math.floor(Math.random() * flakes.length)];
      const dur = 6 + Math.random() * 7;
      f.style.left = Math.random() * 100 + "vw";
      f.style.fontSize = (12 + Math.random() * 14) + "px";
      f.style.opacity = 0.5 + Math.random() * 0.5;
      f.style.animationDuration = dur + "s";
      f.style.setProperty("--sway", ((Math.random() - 0.5) * 60) + "px");
      snowBox.appendChild(f);
      setTimeout(() => f.remove(), dur * 1000);
    }, 350);
  </script>
</body>
</body>
</html>
