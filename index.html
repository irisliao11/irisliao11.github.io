<!DOCTYPE html>
<html>
<head>
  <title>time capsule</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="notebook.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <button id="newTab">+ new tab</button>
      <div id="tabList"></div>
    </aside>

    <main class="content">
      <h1 id="title">time capsule</h1>

      <div class="topbar">
        <input type="file" id="photo" accept="image/*">
        <input type="text" id="caption" placeholder="Describe this memory">
        <button id="add">add</button>
      </div>
      <div id="board"></div>
    </main>
  </div>
  <template id="pageTemplate">
    <h2>Moment</h2>
  </template>

  <script src="script.js"></script>
</body>
</html>
