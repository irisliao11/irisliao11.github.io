<!DOCTYPE html>
<html>
<head>
  <title>time capsule</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="notebook.css">
</head>
<body>
  <main class="content">
    <div class="corner corner-left">
      <button id="newTab">+ new tab</button>
    </div>

    <div class="corner corner-right">
      <label for="openDate" class="bar-label">opens on</label>
      <input type="datetime-local" id="openDate">
      <button id="seal">seal this tab</button>
    </div>

    <h1>time capsule</h1>

    <div class="topbar">
      <div class="bar-center">
        <input type="file" id="photo" accept="image/*">
        <input type="text" id="caption" placeholder="Describe this memory">
        <button id="add">add</button>
      </div>
    </div>

    <div class="desk">
      <div id="tabList"></div>
      <div id="pages"></div>
    </div>
  </main>

  <template id="pageTemplate">
    <h2>Moment</h2>
  </template>

  <script src="script.js"></script>
</body>
</html>
